[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-colab-research"
version = "1.0.0"
description = "Persistent, owner-controlled learning agent and bounded research workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3"]

[project.scripts]
sage = "sage.cli:main"

[tool.setuptools.packages.find]
include = ["sage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
